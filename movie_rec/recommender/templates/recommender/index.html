<!DOCTYPE html>
<body>
    <h1>Movie Recommender</h1>
    <form method="post">
        {% csrf_token %}
        <label for="query">Movie ID or title:</label>
        <input type="text" id="query" name="query" required>
        <button type="submit">Recommend</button>
    </form>
    {% if error %}<p>{{error}}</p>{% endif %}
</body>
